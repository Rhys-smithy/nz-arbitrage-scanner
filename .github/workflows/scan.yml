name: NZ Auction Scanner

on:
  schedule:
    # Runs at 18:00 UTC = 6am NZST / 7am NZDT. GitHub Actions cron doesn't
    # follow DST, so expect the notification to land an hour later during
    # NZ daylight saving (roughly late Sept - early Apr) -- adjust the
    # cron string then if the timing bugs you.
    - cron: "0 18 * * *"
  workflow_dispatch:      # <-- lets you trigger a run manually from the
                          #     GitHub mobile app: Actions tab > this
                          #     workflow > "Run workflow"
    inputs:
      rescan:
        description: "Rescan everything (ignore what's already been seen -- useful for testing a change)"
        type: boolean
        default: false

# Needed so the workflow can commit the generated reports back into the repo,
# which is what lets the dashboard load them automatically.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore seen-listings cache
        uses: actions/cache@v4
        with:
          path: data
          key: seen-cache-${{ github.run_id }}
          restore-keys: |
            seen-cache-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "${{ github.event.inputs.rescan }}" = "true" ]; then
            echo "Rescan requested -- ignoring seen-listings cache for this run"
            python main.py --rescan
          else
            python main.py
          fi

      # ------------------------------------------------------------------
      # Build a small manifest so the dashboard can find reports without
      # having to list the directory (and can show newest-first instantly).
      # Also prunes old reports so the repo doesn't grow forever.
      # ------------------------------------------------------------------
      - name: Prune old reports and build manifest
        if: always()
        run: |
          mkdir -p reports
          python - <<'PY'
          import json, os, re, glob
          from datetime import datetime

          KEEP = 60  # how many report *runs* to retain in the repo

          reports_dir = "reports"
          csvs = sorted(glob.glob(os.path.join(reports_dir, "opportunities_*.csv")))

          def stamp(path):
              m = re.search(r"opportunities_(\d{8})_(\d{4})", os.path.basename(path))
              if not m:
                  return None
              try:
                  return datetime.strptime(m.group(1) + m.group(2), "%Y%m%d%H%M")
              except ValueError:
                  return None

          dated = [(stamp(p), p) for p in csvs]
          dated = [(d, p) for d, p in dated if d is not None]
          dated.sort(key=lambda t: t[0])

          # Prune oldest runs beyond KEEP (csv + matching xlsx).
          for _, path in dated[:-KEEP] if len(dated) > KEEP else []:
              xlsx = path[:-4] + ".xlsx"
              for f in (path, xlsx):
                  if os.path.exists(f):
                      os.remove(f)
                      print("pruned", f)

          dated = dated[-KEEP:]

          entries = []
          for d, path in reversed(dated):   # newest first
              base = os.path.basename(path)
              xlsx = path[:-4] + ".xlsx"
              try:
                  with open(path, encoding="utf-8") as f:
                      # count non-blank data lines (blank rows are category separators)
                      lines = [ln for ln in f.read().splitlines()[1:] if ln.strip(",").strip()]
                  row_count = len(lines)
              except OSError:
                  row_count = None
              entries.append({
                  "csv": base,
                  "xlsx": os.path.basename(xlsx) if os.path.exists(xlsx) else None,
                  "timestamp": d.isoformat(timespec="minutes"),
                  "rows": row_count,
              })

          manifest = {
              "generated_at": datetime.utcnow().isoformat(timespec="seconds") + "Z",
              "count": len(entries),
              "reports": entries,
          }
          with open(os.path.join(reports_dir, "index.json"), "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          print("manifest written with", len(entries), "report(s)")
          PY

      - name: Commit reports back to the repo
        if: always()
        run: |
          git config user.name  "nz-auction-scanner[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -f reports/
          if git diff --staged --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Scan results $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            # Retry once in case a concurrent run pushed first.
            git push || (git pull --rebase && git push)
          fi

      - name: Upload reports as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-report-${{ github.run_id }}
          path: |
            reports/*.csv
            reports/*.xlsx
          if-no-files-found: ignore
          retention-days: 30
